
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>AI Web App</title>

    <!-- Link CSS -->
    <link rel="stylesheet"
          href="{{ url_for('static', filename='#styles.css') }}">
</head>

<body>

    <div class="container">

        <h2>DBS Price Prediction</h2>

        <h4> Exchange Rate USD to SGD (eg 1.3) </h4>

        <form action="/dbsResult" method="post">
            <input type="number" step="0.01" name="q" required>
            <input type="submit" value="Enter">
        </form>

        {% if q %}
            <p>Exchange Rate: {{ q }}</p>
        {% endif %}

        <form action="/main" method="post">
            <input type="submit" value="Main">
        </form>

    </div>

</body>
</html>
